name: release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean --draft --release-notes docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check release packages before publishing
        run: python3 scripts/check_packages.py dist
      - name: Publish verified release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "docs/releases/$GITHUB_REF_NAME.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
