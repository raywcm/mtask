name: test-and-package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -timeout 60s ./...
      - run: python3 scripts/third_party_notices.py --check
      - name: Check release installer
        run: python3 scripts/installer_test.py
      - run: go build -race -o bin/tdock ./cmd/tdock
      - run: python3 scripts/integration.py
      - name: Verify upgrade from mtask
        run: |
          mkdir -p "$RUNNER_TEMP/taskdock-legacy"
          git archive v0.5.2 | tar -x -C "$RUNNER_TEMP/taskdock-legacy"
          (cd "$RUNNER_TEMP/taskdock-legacy" && go build -o "$RUNNER_TEMP/legacy-mtask" ./cmd/mtask)
          python3 scripts/rename_regression.py bin/tdock "$RUNNER_TEMP/legacy-mtask"
      - name: Verify visible screen on reconnect
        run: |
          python3 -m venv "$RUNNER_TEMP/tdock-screen"
          "$RUNNER_TEMP/tdock-screen/bin/pip" install -r scripts/requirements-screen.txt
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/screen_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/ui_regression.py bin/tdock

          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/connection_modes_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/tmux_cli_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/monitor_control_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/monitor_panic_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/multi_terminal_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/theme_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/multi_terminal_regression.py bin/tdock "$RUNNER_TEMP/legacy-mtask"
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/search_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/idle_cpu_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/monitor_dialog_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/history_view_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/history_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/tui_exit_regression.py bin/tdock
          "$RUNNER_TEMP/tdock-screen/bin/python" scripts/detach_keys_regression.py bin/tdock
  package:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=publish
      - run: python3 scripts/apt_repo.py dist dist/apt
      - run: python3 scripts/check_packages.py dist
      - run: python3 scripts/ci_install_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: tdock-local-packages
          path: dist/
          retention-days: 14
